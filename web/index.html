<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Seu cardápio digital!">
  <meta name="google-signin-client_id"
    content="549669468108-vkq356vb6o50j6gh2opr6b5ntgvjn266.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portal_assoc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>IASemBurocracia</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash shimmer exibido até o Flutter renderizar o primeiro frame -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F7F8FA; }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #F7F8FA;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      transition: opacity .4s ease;
    }
    #app-loading.app-loading--hide { opacity: 0; pointer-events: none; }

    .al-wrap {
      width: 100%;
      max-width: 760px;
      padding: 28px 24px;
      box-sizing: border-box;
    }

    /* Bloco base do shimmer */
    .sk {
      background: #E9EBEF;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }
    .sk::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      animation: al-shimmer 1.4s infinite;
    }
    @keyframes al-shimmer { 100% { transform: translateX(100%); } }

    .al-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .sk-avatar { width: 56px; height: 56px; border-radius: 50%; flex: none; }
    .sk-line { height: 13px; border-radius: 7px; }
    .al-head-lines { flex: 1; }
    .al-banner { height: 150px; border-radius: 18px; margin-bottom: 18px; }
    .al-card { height: 84px; border-radius: 16px; margin-bottom: 14px; }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- Google Maps JavaScript API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBUxNIZ4yXZZA752jhoEXLI0vBbXZwaaw0&libraries=places"
    defer></script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

  <script>
    // Map registry keyed by viewId
    var _flutterMaps = {};

    function _initFlutterMap(viewId, lat, lng) {
      var el = document.getElementById(viewId);
      if (!el) return;
      var center = { lat: lat, lng: lng };
      var map = new google.maps.Map(el, {
        center: center,
        zoom: 16,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
      });
      var marker = new google.maps.Marker({ position: center, map: map });
      _flutterMaps[viewId] = { map: map, marker: marker };
    }

    function _updateFlutterMap(viewId, lat, lng) {
      var entry = _flutterMaps[viewId];
      if (!entry) { _initFlutterMap(viewId, lat, lng); return; }
      var pos = { lat: lat, lng: lng };
      entry.map.setCenter(pos);
      entry.marker.setPosition(pos);
    }
  </script>
</head>

<body>
  <!-- Splash shimmer: removido quando o Flutter pinta o primeiro frame -->
  <div id="app-loading">
    <div class="al-wrap">
      <div class="al-header">
        <div class="sk sk-avatar"></div>
        <div class="al-head-lines">
          <div class="sk sk-line" style="width: 55%; margin-bottom: 10px;"></div>
          <div class="sk sk-line" style="width: 35%;"></div>
        </div>
      </div>
      <div class="sk al-banner"></div>
      <div class="sk al-card"></div>
      <div class="sk al-card"></div>
      <div class="sk al-card"></div>
    </div>
  </div>

  <script>
    (function () {
      var removed = false;
      function removeAppLoading() {
        if (removed) return;
        removed = true;
        var el = document.getElementById('app-loading');
        if (!el) return;
        el.classList.add('app-loading--hide');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 450);
      }
      // Flutter dispara este evento ao renderizar o primeiro frame.
      window.addEventListener('flutter-first-frame', removeAppLoading);
      // Segurança: remove após 20s mesmo que o evento não dispare.
      setTimeout(removeAppLoading, 20000);
    })();

    window.addEventListener('load', function (ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>

</html>
